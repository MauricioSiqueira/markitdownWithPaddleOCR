name: Deploy em Produção (Build & Push Docker Image to GHCR)

on:
  workflow_dispatch:
#  push:
#    branches:
#      - main

env:
  IMAGE_NAME: markitdown-api

jobs:
  test:
    name: Testes
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: markitdown-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: markitdown-api/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            build-essential \
            libgl1 \
            libglib2.0-0 \
            libgomp1 \
            libmagic1

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          # pyclipper: compila do fonte para evitar conflito de ABI do zlib nos wheels manylinux
          pip install --no-cache-dir --no-binary pyclipper pyclipper
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-push:
    name: Build & Push
    runs-on: ubuntu-24.04
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }} # Personal Access Token com permissão write:packages (https://github.com/settings/tokens)

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./markitdown-api
          push: true
          tags: |
            ghcr.io/somesoftware/markitdown-api:latest
            ghcr.io/somesoftware/markitdown-api:${{ github.sha }}
