services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      REDIS_TTL: "86400"
      OCR_ENABLED: "true"
      OCR_LANGUAGE: pt
      OCR_DPI: "300"
      OCR_MIN_TEXT_LENGTH: "30"
      OCR_MIN_IMAGE_RATIO: "0.10"
      OCR_PREPROCESSING: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
